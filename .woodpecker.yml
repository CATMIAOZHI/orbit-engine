# Cefrium SDK (cef-android) — quality gate.
# Fast, no-build checks that catch release-tooling and patch-set regressions on
# every push/PR. The heavy on-device instrumented suite + the multi-ABI build run
# on the maintainer's workstation / the cefrium-sample CI, not here.

# Runs on pull requests only — not on every push — to keep CI minutes for review
# gates, not routine commits.
when:
  - event: pull_request

steps:
  quality-gate:
    image: debian:trixie-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq bash python3 file >/dev/null

      # 1. The release/engine tooling must stay syntactically valid.
      - |
        for s in cefrium_sdk/*.sh; do
          echo "  bash -n $s"
          bash -n "$s" || exit 1
        done

      # 2. patch.cfg must be a valid Python literal (patcher.py reads it).
      - python3 -c "import ast; ast.parse(open('patch/patch.cfg').read()); print('patch.cfg parses OK')"

      # 3. The 'auditable' patch count must match reality (the figure on the
      #    landing/README is derived by update-patch-stats.sh — keep it honest).
      - |
        N=$(ls patch/patches/android/*.patch | wc -l | tr -d ' ')
        echo "  android patches: $N"
        grep -q "All $N Chromium patches" README.md \
          || { echo "FAIL: README says a different patch count than $N (run update-patch-stats.sh)"; exit 1; }
        echo "  README patch count consistent ($N)"

      # 4. Every android patch must be registered in patch.cfg (none applied
      #    only by an ad-hoc script — see the apply_all_patches.sh cleanup).
      - |
        miss=0
        for p in patch/patches/android/*.patch; do
          name="android/$(basename "$p" .patch)"
          grep -q "'$name'" patch/patch.cfg || { echo "FAIL: $name not in patch.cfg"; miss=1; }
        done
        [ "$miss" = 0 ] && echo "  all android patches registered in patch.cfg"
        exit $miss
