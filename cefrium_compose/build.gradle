// Self-contained Gradle module that builds cefrium-compose.aar from the
// canonical source in java/src. This is a production SDK component and lives in
// the SDK repo (cef-android), not in the samples repo. The samples only consume
// the published AAR.
plugins {
    // AGP 9 provides built-in Kotlin, so the org.jetbrains.kotlin.android plugin
    // is removed (AGP 9 rejects it). Only the Compose compiler plugin is applied.
    id 'com.android.library' version '9.4.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
    // Dokka (API docs) is decoupled from the AAR build: Dokka 1.9.x is
    // incompatible with Gradle 9 and Dokka 2.x has a different DSL. Docs are
    // regenerated separately (see RELEASING/README). Re-add under Dokka 2.x later.
}

android {
    namespace 'com.cefrium.compose'
    compileSdk 37

    defaultConfig {
        minSdk 29
        targetSdk 34

        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        // Canonical source lives in java/src (not the Gradle default). AGP's
        // built-in Kotlin needs the Kotlin source root set explicitly too, else
        // the .kt files are skipped and the AAR ships an empty classes.jar.
        main.java.srcDirs = ['java/src']
        main.kotlin.srcDirs = ['java/src']
    }
}

dependencies {
    // Cefrium SDK — compileOnly so it's not bundled in the compose AAR.
    // Copy the freshly built cefrium-sdk.aar into libs/ before building
    // (the consumer app provides it at runtime). libs/ is gitignored.
    compileOnly files('libs/cefrium-sdk.aar')

    // Compose
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.runtime:runtime'
    // Host lifecycle (LifecycleOwner/LifecycleEventObserver) for CefriumView's
    // background-media auto-wiring. compileOnly: every Compose consumer already
    // ships androidx.lifecycle (compose-ui depends on it).
    compileOnly 'androidx.lifecycle:lifecycle-common:2.6.1'

    configurations.all {
        exclude group: 'com.google.guava', module: 'listenablefuture'
        exclude group: 'org.jspecify'
    }
}
