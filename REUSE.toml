version = 1
SPDX-PackageName = "cefrium"
SPDX-PackageSupplier = "Juan Manuel Méndez Rey <cefrium@proton.me>"
SPDX-PackageDownloadLocation = "https://codeberg.org/cefrium/cef-android"

# Cefrium Android port — dual licensed: LGPL-3.0-or-later OR Commercial
# Open source use: LGPL-3.0-or-later
# Commercial use without copyleft: Cefrium Commercial License
# See LICENSES/ directory for full texts.

# Fallback -- upstream CEF code. First, because the last matching annotation
# wins: every more specific block below overrides it.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2008-2026 The Chromium Embedded Framework Authors", "2026 Juan Manuel Méndez Rey <cefrium@proton.me>"]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileComment = "Fallback for upstream CEF files not covered by specific rules."

# CEF upstream code (BSD-licensed, not modified by Cefrium)
[[annotations]]
path = ["include/**", "libcef_dll/**", "tools/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2008-2026 The Chromium Embedded Framework Authors"
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileComment = "Upstream CEF code. BSD license from original project."

# Android platform code headed for upstream CEF: CEF's BSD licence, so it can
# be submitted unmodified.
[[annotations]]
path = [
    "libcef/browser/android/**",
    "patch/patches/android/**",
]
precedence = "override"
SPDX-FileCopyrightText = ["2008-2026 The Chromium Embedded Framework Authors", "2026 Juan Manuel Méndez Rey <cefrium@proton.me>"]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileComment = "Android platform support for CEF, intended for upstream."

# Cefrium Android port — new code (dual licensed)
[[annotations]]
path = [
    "libcef/browser/android/cefrium_*",
    "libcef/browser/android/adblock_filter.*",
    "cefrium_sdk/**",
    "cefrium_compose/**",
    "cefrium_unifiedpush/**",
    "cefrium_relay/**",
    "cefrium_instrumentation_test/**",
    "tests/cef_android_test/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Juan Manuel Méndez Rey <cefrium@proton.me>"
SPDX-License-Identifier = "LGPL-3.0-or-later OR LicenseRef-Cefrium-Commercial"
SPDX-FileComment = "Cefrium Android port. Dual licensed: LGPL v3 for open source use, Cefrium Commercial License for proprietary use. Contact cefrium@proton.me for commercial licensing."

# Cefrium modifications to upstream CEF code: kept under CEF's BSD licence so
# they can go upstream.
[[annotations]]
path = [
    "libcef/browser/osr/cef_context_factory_android.*",
    "libcef/browser/osr/render_widget_host_view_osr.*",
    "BUILD.gn",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2008-2026 The Chromium Embedded Framework Authors", "2026 Juan Manuel Méndez Rey <cefrium@proton.me>"]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileComment = "Upstream CEF code modified for Android support, intended for upstream."

# Documentation and screenshots
[[annotations]]
path = ["README.md", "assets/**", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Juan Manuel Méndez Rey <cefrium@proton.me>"
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileComment = "Documentation, screenshots, and metadata."

# License texts
[[annotations]]
path = ["LICENSES/**"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "License text files."
