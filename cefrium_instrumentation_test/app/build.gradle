// Dedicated instrumentation harness for the Cefrium SDK. This is NOT a sample
// or demo — it is the authoritative on-device test host for the SDK, living in
// the SDK repo so a clone of cef-android is self-verifying and CI can gate the
// release on it. Covers both layers: the Java SDK (com.cefrium) and the Compose
// wrapper (com.cefrium.compose).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.cefrium'
}

android {
    packaging { jniLibs { useLegacyPackaging = true } }
    namespace 'com.cefrium.itest'
    compileSdk 37

    defaultConfig {
        applicationId 'com.cefrium.itest'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    androidResources {
        noCompress 'dat', 'pak', 'bin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
    }

    // The same suite against an app minified the way a consumer minifies it:
    // run-instrumentation-suite.sh --minified passes -PcefriumMinified.
    buildTypes {
        minified {
            initWith release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-minified.pro'
            testProguardFiles 'proguard-test.pro'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    if (providers.gradleProperty('cefriumMinified').isPresent()) {
        testBuildType 'minified'
    }

}

dependencies {
    // The artifacts under test. Copy freshly built AARs into libs/ before
    // running (libs/ is gitignored):
    //   cp out/<dir>/cefrium-sdk.aar      app/libs/
    //   cp cef/cefrium_compose/build/outputs/aar/cefrium-compose-release.aar \
    //      app/libs/cefrium-compose.aar
    implementation files('libs/cefrium-sdk.aar')
    implementation files('libs/cefrium-compose.aar')
    // What the SDK's POM declares, which a file dependency does not read, so
    // the suite runs on the classpath a Maven consumer gets: pom-deps.txt, and
    // the runtime libraries listed inside the AAR under test.
    file('../../cefrium_sdk/pom-deps.txt').eachLine { line ->
        line = line.trim()
        if (line && !line.startsWith('#')) add('implementation', line)
    }
    zipTree(file('libs/cefrium-sdk.aar')).matching { include 'cefrium-maven-deps.txt' }
            .singleFile.eachLine { line ->
        line = line.trim()
        if (line && !line.startsWith('#')) add('runtimeOnly', line)
    }

    // Compose (for the Compose-layer tests + createComposeRule host activity).
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Instrumented test deps.
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // Compose ui-test pulls Espresso 3.5, whose UiController reflects on
    // InputManager.getInstance(), removed in Android 17.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
    // CefriumWebPushTest reads the InstanceID token itself.
    androidTestImplementation 'com.google.android.gms:play-services-iid:17.0.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    minifiedImplementation 'androidx.compose.ui:ui-test-manifest'

}
